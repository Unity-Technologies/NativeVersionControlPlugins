name: Zip VCS plugins
agent:
  type: Unity::VM
  image: build-system/unity-extra-windows-10:v0.3-553488
  flavor: b1.xlarge

interpreter: powershell
commands:
  - mkdir linux64
  - mkdir OSXx64
  - mkdir Win32
  - Copy-Item Build/linux64/* linux64 -Recurse
  - Copy-Item Build/OSXx64/* OSXx64 -Recurse
  - Copy-Item Build/Win32/*  Win32 -Recurse

artifacts:
  builds:
    paths:
      - "linux64/**"
      - "OSXx64/**"
      - "Win32/**"

dependencies:
  - .yamato/windows-build.yml
  - .yamato/linux-build.yml
  - .yamato/osx-build.yml

triggers:
  branches:
    only:
      - "/.*/"
